<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef Stack">
<meta name="theme-color" content="#1a6ea8">
<title>Nemo's Reef Stack 🐠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a6ea8;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
  }
  #game { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #home {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 5;
    font: bold 14px -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
    text-decoration: none;
    background: rgba(13, 50, 90, 0.7);
    border: 2px solid #ffd94a;
    border-radius: 18px;
    padding: 7px 14px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html">🐠 Nemo</a>
<script src="nemo-kit.js"></script>
<script>
(() => {
  const VERSION = 'stack v4';
  const K = window.NemoKit; // Nemo himself, his sounds and the five worlds
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const home = document.getElementById('home');

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // everything is sized from a 700px-tall design; the tower is built in a
  // field of fixed design width so it plays the same on a phone and a desktop
  const S = () => H / 700;
  const FIELD = () => Math.min(W, 430 * S());
  const OX = () => (W - FIELD()) / 2;      // left edge of the field on screen
  const BH = () => 34 * S();               // block height
  const GROUND = () => H * 0.86;           // top of the seabed
  const PERFECT = () => 5 * S();           // how close counts as a perfect drop
  const WORLD_EVERY = 15;                  // floors per world
  const worldOf = floors => Math.floor(floors / WORLD_EVERY) % K.WORLDS.length;

  let state = 'ready';                     // ready | play | over
  let blocks, cur, debris, bubbles, pops, score, perfect, cam, t, overT, banner, shake, bgScroll, fallen;
  const fx = K.fx();                       // fart clouds and fireworks, in tower space
  let best = +(localStorage.getItem('reefStackBest') || 0);
  const board = K.board('stack', 'floors'); // the shared Top 100

  function reset() {
    const w = FIELD() * 0.5;
    blocks = [{ x: (FIELD() - w) / 2, w, world: 0, seed: 0 }];
    debris = [];
    pops = [];
    score = 0;
    perfect = 0;
    cam = 0;
    t = 0;
    overT = 0;
    banner = null;
    shake = 0;
    bgScroll = 0;
    fallen = null;
    bubbles = [];
    for (let i = 0; i < 14; i++) bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: (2 + Math.random() * 6) * S(), v: 14 + Math.random() * 26 });
    spawn();
    state = 'ready';
  }
  function spawn() {
    const top = blocks[blocks.length - 1];
    const dir = blocks.length % 2 ? 1 : -1; // blocks come in from alternate sides
    cur = {
      x: dir > 0 ? -top.w * 0.6 : FIELD() - top.w * 0.4,
      w: top.w, dir,
      speed: (150 + Math.min(score, 60) * 5) * S(),
      world: worldOf(score), seed: Math.random() * 7
    };
  }
  // where things sit in tower space (the camera is applied when drawing)
  const floorY = level => GROUND() - (level + 1) * BH();

  // ---------- the one move: drop the sliding block ----------
  function tap() {
    if (board.isOpen()) return;
    if (state === 'ready') { state = 'play'; K.loadFartSamples(); return; }
    if (state === 'over') { if (overT > 0.6) reset(); return; }
    const top = blocks[blocks.length - 1], s = S();
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    const level = blocks.length;
    const nemoX = OX() + cur.x + cur.w / 2, nemoY = floorY(level) - 13 * s;
    if (overlap <= 0) {
      // missed the tower entirely: block and fish go down together
      debris.push({ x: cur.x, level, w: cur.w, world: cur.world, seed: cur.seed, vx: cur.dir * 60 * s, vy: 0, rot: 0, vr: cur.dir * 2, dy: 0 });
      fallen = { x: nemoX, y: nemoY, vx: cur.dir * 70 * s, vy: -260 * s, rot: 0, dir: cur.dir };
      cur = null;
      state = 'over';
      overT = 0;
      shake = 0.35;
      K.sndHit();
      setTimeout(K.sndBlub, 250);
      setTimeout(() => K.playFartSample('proud', 0.9, 1), 450); // a long sad one to finish
      fx.fart(nemoX, nemoY + 10 * s, s, -1, 9);
      if (score > best) { best = score; localStorage.setItem('reefStackBest', best); }
      if (score >= best) board.submit(score); // a record, or a tie the board may have missed
      return;
    }
    let x = left, w = overlap;
    if (Math.abs(cur.x - top.x) <= PERFECT()) {
      // a perfect drop keeps the full width, and every 4th in a row grows the block back
      perfect++;
      x = top.x;
      w = top.w;
      if (perfect % 4 === 0) {
        const grown = Math.min(w * 1.15, FIELD() * 0.5);
        x -= (grown - w) / 2;
        w = grown;
      }
      pops.push({ x: x + w / 2, level, w, life: 0.5 });
      K.beep(520 * Math.pow(1.06, Math.min(perfect, 14)), 0.14, 'triangle', 0.09);
    } else {
      perfect = 0;
      // the overhang is sliced off and sinks... and Nemo lets one go
      const lost = cur.x < top.x;
      const px = lost ? cur.x : top.x + top.w;
      debris.push({ x: px, level, w: cur.w - overlap, world: cur.world, seed: cur.seed, vx: (lost ? -1 : 1) * 50 * s, vy: 0, rot: 0, vr: (lost ? -1 : 1) * 1.5, dy: 0 });
      K.sndFart();
      fx.fart(nemoX - cur.dir * 20 * s, nemoY + 6 * s, s, -cur.dir);
    }
    blocks.push({ x, w, world: cur.world, seed: cur.seed });
    score++;
    if (score % WORLD_EVERY === 0) {
      // the tower rises into the next world of the main game
      banner = { msg: K.WORLDS[worldOf(score)].name, sub: `${score} floors!`, t: 2.2 };
      K.sndChest();
      fx.fireworks(nemoX, nemoY, s);
    } else if (score % 10 === 0) {
      banner = { msg: `${score} floors!`, t: 1.8 };
      K.snd1Up();
      fx.fireworks(nemoX, nemoY, s);
      K.sndFartSong(Math.min(score / 10 - 1, 4)); // an ever-fancier tune of the real thing
    }
    spawn();
  }

  window.addEventListener('touchstart', e => {
    if (e.target !== canvas) return;
    e.preventDefault();
    tap();
  }, { passive: false });
  window.addEventListener('mousedown', e => { if (e.target === canvas) tap(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') { e.preventDefault(); tap(); }
  });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    const s = S();
    bgScroll += 14 * s * dt;
    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; }
    }
    if (banner && (banner.t -= dt) <= 0) banner = null;
    shake = Math.max(0, shake - dt);
    fx.update(dt, s);
    for (const p of pops) p.life -= dt;
    pops = pops.filter(p => p.life > 0);
    for (const d of debris) {
      d.vy += 1400 * s * dt;
      d.dy += d.vy * dt;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
    }
    debris = debris.filter(d => d.dy < H * 2);
    if (fallen) {
      // Nemo tumbles off with the block he was riding and settles on the sand
      fallen.vy += 1400 * s * dt;
      fallen.x += fallen.vx * dt;
      fallen.y = Math.min(GROUND() - 12 * s, fallen.y + fallen.vy * dt);
      if (fallen.y < GROUND() - 12 * s) fallen.rot += fallen.dir * 5 * dt;
      else { fallen.vx *= 1 - dt * 4; fallen.rot += (Math.PI / 2 * fallen.dir - fallen.rot) * Math.min(1, dt * 8); }
    }

    if (state !== 'over' && cur) {
      // the block slides back and forth above the tower, a little past each edge
      cur.x += cur.dir * cur.speed * dt;
      if (cur.x < -cur.w * 0.6) { cur.x = -cur.w * 0.6; cur.dir = 1; }
      if (cur.x > FIELD() - cur.w * 0.4) { cur.x = FIELD() - cur.w * 0.4; cur.dir = -1; }
    }
    if (state === 'over') overT += dt;
    // keep about eight floors below the moving block in view
    const target = state === 'over' ? 0 : Math.max(0, (blocks.length - 8) * BH());
    cam += (target - cam) * Math.min(1, dt * (state === 'over' ? 2.5 : 5));
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(str, x, y, size, fill = '#fff', stroke = '#123a5c') {
    ctx.font = `bold ${size}px -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 8);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }
  // a block is a slice of the main game's gates: coral on the reef, riveted
  // steel in space, neon at the rave, jewelled gold in the kingdom
  function drawBlock(x, y, w, b, alpha = 1) {
    const s = S(), bh = BH(), world = K.WORLDS[b.world], cols = K.blockColors(b.world, t, b.seed);
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, cols[0]);
    g.addColorStop(0.5, cols[1]);
    g.addColorStop(1, cols[2]);
    ctx.fillStyle = g;
    roundRect(x, y + 1, w, bh - 2, 6 * s);
    ctx.fill();
    ctx.strokeStyle = world.edge;
    ctx.lineWidth = 2 * s;
    ctx.stroke();
    if (w > 16 * s) {
      const my = y + bh / 2;
      ctx.beginPath();
      ctx.moveTo(x + 4 * s, my);
      if (b.world === 1 || b.world === 2 || b.world === 3) ctx.lineTo(x + w - 4 * s, my);   // seams and glow bars
      else ctx.quadraticCurveTo(x + w / 2, my + 6 * s, x + w - 4 * s, my);                    // coral ridges
      ctx.stroke();
      if (b.world === 1 || b.world === 2) {
        ctx.fillStyle = 'rgba(20, 25, 40, 0.5)';                                            // rivets
        ctx.beginPath(); ctx.arc(x + 8 * s, my, 2 * s, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - 8 * s, my, 2 * s, 0, Math.PI * 2); ctx.fill();
      } else if (b.world === 4) {
        ctx.fillStyle = '#e0455c';                                                          // a jewel
        ctx.beginPath(); ctx.arc(x + w / 2, my + 3 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawNemoAt(x, y, dir, rot, dead) {
    const s = S();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(1.15 * s * dir, 1.15 * s);
    K.drawNemo(ctx, { tail: t * 7, fin: dead ? 0 : (Math.sin(t * 8) + 1) / 2, dead, rave: worldOf(score) === 3, t });
    ctx.restore();
  }

  function draw() {
    const s = S(), ox = OX(), bh = BH(), gy = GROUND(), world = worldOf(score);
    K.drawBackdrop(ctx, W, H, world, bgScroll, t);
    for (const b of bubbles) {
      if (world === 1) {
        // out in space the bubbles are stars
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      }
    }

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * s * shake, (Math.random() - 0.5) * 14 * s * shake);
    // when the run ends, pull back so the whole tower fits on screen
    let zoom = 1;
    if (state === 'over') {
      const towerH = (blocks.length + 2) * bh, fit = Math.min(1, (gy - H * 0.3) / towerH);
      const k = Math.min(1, overT / 0.9);
      zoom = 1 + (fit - 1) * (1 - Math.pow(1 - k, 3));
    }
    ctx.translate(W / 2, gy + cam);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -gy); // from here on, tower space with the camera applied

    // seabed
    ctx.fillStyle = '#e8d59a';
    ctx.fillRect(-W * 4, gy, W * 9, H * 2);
    ctx.fillStyle = '#d9c280';
    ctx.fillRect(-W * 4, gy, W * 9, 10 * s);

    fx.drawFarts(ctx);
    blocks.forEach((b, i) => drawBlock(ox + b.x, floorY(i), b.w, b));
    for (const p of pops) {
      // a ring flashes off a perfect drop
      const k = 1 - p.life / 0.5, grow = k * 16 * s;
      ctx.strokeStyle = `rgba(255,255,255,${1 - k})`;
      ctx.lineWidth = 3 * s;
      roundRect(ox + p.x - p.w / 2 - grow, floorY(p.level) - grow, p.w + grow * 2, bh + grow * 2, 9 * s);
      ctx.stroke();
    }
    for (const d of debris) {
      ctx.save();
      ctx.translate(ox + d.x + d.w / 2, floorY(d.level) + d.dy + bh / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -bh / 2, d.w, d, 0.85);
      ctx.restore();
    }
    if (cur) {
      const y = floorY(blocks.length);
      drawBlock(ox + cur.x, y, cur.w, cur);
      // Nemo rides the block, facing the way it is sliding
      drawNemoAt(ox + cur.x + cur.w / 2, y - 13 * s + Math.sin(t * 6) * 2 * s, cur.dir, 0, false);
    }
    if (fallen) drawNemoAt(fallen.x, fallen.y, fallen.dir, fallen.rot, true);
    fx.drawSparks(ctx, s);
    ctx.restore();

    // ---------- UI ----------
    if (state === 'play') {
      text(score, W / 2, 70 * s, 52 * s);
      if (perfect > 1) text(`PERFECT x${perfect}`, W / 2, 112 * s, 18 * s, '#ffd94a');
      if (banner) {
        ctx.globalAlpha = Math.min(1, banner.t / 0.4);
        text(banner.msg, W / 2, H * 0.3, Math.min(34 * s, W * 0.08), '#ffd94a');
        if (banner.sub) text(banner.sub, W / 2, H * 0.36, 20 * s);
        ctx.globalAlpha = 1;
      }
    } else if (state === 'ready') {
      text("Nemo's", W / 2, H * 0.15, 38 * s, '#ffd94a');
      text('Reef Stack', W / 2, H * 0.22, 40 * s, '#ffd94a');
      text('Tap to drop the block', W / 2, H * 0.34, 24 * s);
      text('Line it up. Whatever hangs over is cut off.', W / 2, H * 0.39, Math.min(15 * s, W * 0.038), '#cdeef5');
      if (best > 0) text(`Best: ${best} floors`, W / 2, H * 0.45, 19 * s, '#ffd94a');
      text(board.line(), W / 2, H * 0.5, Math.min(15 * s, W * 0.038), '#aef1b8');
      text('🔊 Sound ON highly recommended', W / 2, H * 0.56, Math.min(16 * s, W * 0.046), '#ffe34d');
      text('for the laughs... trust us.', W / 2, H * 0.595, Math.min(14 * s, W * 0.042), '#cdeef5');
      text(VERSION, W / 2, H * 0.965, 12 * s, 'rgba(255,255,255,0.55)', 'rgba(0,0,0,0.25)');
    } else if (overT > 0.4) {
      ctx.fillStyle = 'rgba(0,0,20,0.45)';
      ctx.fillRect(0, 0, W, H * 0.34);
      text('Blub... it toppled!', W / 2, H * 0.065, Math.min(20 * s, W * 0.048), '#ff8b6b');
      text(`${score} ${score === 1 ? 'floor' : 'floors'}`, W / 2, H * 0.125, 40 * s, '#ffd94a');
      text(score >= best && score > 0 ? 'New record! 👑' : `Best: ${best}`, W / 2, H * 0.19, 20 * s, score >= best && score > 0 ? '#aef1b8' : '#fff');
      text(board.line(), W / 2, H * 0.245, Math.min(15 * s, W * 0.038), '#aef1b8');
      if (overT > 0.6 && Math.floor(overT * 2) % 2 === 0) text('Tap to try again', W / 2, H * 0.3, 20 * s);
    }
    home.style.display = state === 'play' ? 'none' : 'block';
    board.show(state !== 'play');
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // a small window onto the game for automated play-testing
  window.__stack = {
    tap,
    get: () => ({
      state, score, best, perfect, overT, world: worldOf(score),
      cur: cur && { x: cur.x, w: cur.w, dir: cur.dir, speed: cur.speed },
      top: { x: blocks[blocks.length - 1].x, w: blocks[blocks.length - 1].w },
      field: FIELD(), tol: PERFECT()
    })
  };

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
