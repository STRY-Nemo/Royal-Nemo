<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reef Stack">
<meta name="theme-color" content="#1a6ea8">
<title>Nemo's Reef Stack 🐠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a6ea8;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
  }
  #game { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #home {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 5;
    font: bold 14px -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
    text-decoration: none;
    background: rgba(13, 50, 90, 0.7);
    border: 2px solid #ffd94a;
    border-radius: 18px;
    padding: 7px 14px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html">🐠 Nemo</a>
<script>
(() => {
  const VERSION = 'stack v1';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const home = document.getElementById('home');

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // everything is sized from a 700px-tall design; the tower is built in a
  // field of fixed design width so it plays the same on a phone and a desktop
  const S = () => H / 700;
  const FIELD = () => Math.min(W, 430 * S());
  const OX = () => (W - FIELD()) / 2;      // left edge of the field on screen
  const BH = () => 34 * S();               // block height
  const GROUND = () => H * 0.86;           // top of the seabed
  const PERFECT = () => 5 * S();           // how close counts as a perfect drop

  let state = 'ready';                     // ready | play | over
  let blocks, cur, debris, bubbles, pops, score, perfect, cam, t, overT, banner, shake;
  let best = +(localStorage.getItem('reefStackBest') || 0);

  function reset() {
    const w = FIELD() * 0.5;
    blocks = [{ x: (FIELD() - w) / 2, w, hue: 200 }];
    debris = [];
    pops = [];
    score = 0;
    perfect = 0;
    cam = 0;
    t = 0;
    overT = 0;
    banner = null;
    shake = 0;
    bubbles = [];
    for (let i = 0; i < 14; i++) bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: (2 + Math.random() * 6) * S(), v: 14 + Math.random() * 26 });
    spawn();
    state = 'ready';
  }
  function spawn() {
    const top = blocks[blocks.length - 1];
    const dir = blocks.length % 2 ? 1 : -1; // blocks come in from alternate sides
    cur = {
      x: dir > 0 ? -top.w * 0.6 : FIELD() - top.w * 0.4,
      w: top.w, dir,
      speed: (150 + Math.min(score, 60) * 5) * S(),
      hue: (top.hue + 14) % 360
    };
  }

  // ---------- sound: tiny WebAudio bleeps, no assets ----------
  let actx = null;
  function beep(freq, dur, type = 'triangle', vol = 0.08, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio is optional */ }
  }

  // ---------- the one move: drop the sliding block ----------
  function tap() {
    if (state === 'ready') { state = 'play'; return; }
    if (state === 'over') { if (overT > 0.6) reset(); return; }
    const top = blocks[blocks.length - 1], s = S();
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
    const overlap = right - left;
    const level = blocks.length;
    if (overlap <= 0) {
      // missed the tower entirely
      debris.push({ x: cur.x, level, w: cur.w, hue: cur.hue, vx: cur.dir * 60 * s, vy: 0, rot: 0, vr: cur.dir * 2, dy: 0 });
      cur = null;
      state = 'over';
      overT = 0;
      shake = 0.35;
      beep(180, 0.35, 'sawtooth', 0.12, 50);
      if (score > best) { best = score; localStorage.setItem('reefStackBest', best); }
      return;
    }
    let x = left, w = overlap;
    if (Math.abs(cur.x - top.x) <= PERFECT()) {
      // a perfect drop keeps the full width, and every 4th in a row grows the block back
      perfect++;
      x = top.x;
      w = top.w;
      if (perfect % 4 === 0) {
        const grown = Math.min(w * 1.15, FIELD() * 0.5);
        x -= (grown - w) / 2;
        w = grown;
      }
      pops.push({ x: x + w / 2, level, w, life: 0.5 });
      beep(520 * Math.pow(1.06, Math.min(perfect, 14)), 0.14, 'triangle', 0.09);
    } else {
      perfect = 0;
      // the overhang is sliced off and sinks
      const px = cur.x < top.x ? cur.x : top.x + top.w;
      debris.push({ x: px, level, w: cur.w - overlap, hue: cur.hue, vx: (cur.x < top.x ? -1 : 1) * 50 * s, vy: 0, rot: 0, vr: (cur.x < top.x ? -1 : 1) * 1.5, dy: 0 });
      beep(300, 0.09, 'square', 0.06, 200);
    }
    blocks.push({ x, w, hue: cur.hue });
    score++;
    if (score % 10 === 0) {
      banner = { msg: `${score} floors!`, t: 1.8 };
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.13, 'triangle', 0.08), i * 90));
    }
    spawn();
  }

  window.addEventListener('touchstart', e => {
    if (e.target !== canvas) return;
    e.preventDefault();
    tap();
  }, { passive: false });
  window.addEventListener('mousedown', e => { if (e.target === canvas) tap(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') { e.preventDefault(); tap(); }
  });

  // ---------- update ----------
  function update(dt) {
    t += dt;
    const s = S();
    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; }
    }
    if (banner && (banner.t -= dt) <= 0) banner = null;
    shake = Math.max(0, shake - dt);
    for (const p of pops) p.life -= dt;
    pops = pops.filter(p => p.life > 0);
    for (const d of debris) {
      d.vy += 1400 * s * dt;
      d.dy += d.vy * dt;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
    }
    debris = debris.filter(d => d.dy < H * 2);

    if (state !== 'over' && cur) {
      // the block slides back and forth above the tower, a little past each edge
      cur.x += cur.dir * cur.speed * dt;
      if (cur.x < -cur.w * 0.6) { cur.x = -cur.w * 0.6; cur.dir = 1; }
      if (cur.x > FIELD() - cur.w * 0.4) { cur.x = FIELD() - cur.w * 0.4; cur.dir = -1; }
    }
    if (state === 'over') overT += dt;
    // keep about eight floors below the moving block in view
    const target = state === 'over' ? 0 : Math.max(0, (blocks.length - 8) * BH());
    cam += (target - cam) * Math.min(1, dt * (state === 'over' ? 2.5 : 5));
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(str, x, y, size, fill = '#fff', stroke = '#123a5c') {
    ctx.font = `bold ${size}px -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 8);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }
  const levelY = level => GROUND() - (level + 1) * BH() + cam; // top edge of a block on that floor
  function drawBlock(x, y, w, hue, alpha = 1) {
    const s = S(), bh = BH();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${hue}, 72%, 56%)`;
    roundRect(x, y + 1, w, bh - 2, 7 * s);
    ctx.fill();
    ctx.fillStyle = `hsla(${hue}, 85%, 78%, 0.7)`;
    roundRect(x + 3 * s, y + 3 * s, Math.max(0, w - 6 * s), bh * 0.28, 4 * s);
    ctx.fill();
    ctx.strokeStyle = `hsl(${hue}, 70%, 34%)`;
    ctx.lineWidth = 2 * s;
    roundRect(x, y + 1, w, bh - 2, 7 * s);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    const s = S(), ox = OX(), bh = BH(), gy = GROUND();
    // the water deepens into night as the tower climbs
    const depth = Math.min(1, blocks.length / 60);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${200 + depth * 50}, 65%, ${52 - depth * 34}%)`);
    g.addColorStop(1, `hsl(${208 + depth * 40}, 75%, ${26 - depth * 16}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const b of bubbles) {
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * s * shake, (Math.random() - 0.5) * 14 * s * shake);
    // when the run ends, pull back so the whole tower fits on screen
    let zoom = 1;
    if (state === 'over') {
      const towerH = (blocks.length + 2) * bh, fit = Math.min(1, (gy - H * 0.3) / towerH);
      const k = Math.min(1, overT / 0.9);
      zoom = 1 + (fit - 1) * (1 - Math.pow(1 - k, 3));
    }
    ctx.translate(W / 2, gy + cam);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -(gy + cam));

    // seabed
    ctx.fillStyle = '#e8d59a';
    ctx.fillRect(-W, gy + cam, W * 3, H);
    ctx.fillStyle = '#d9c280';
    ctx.fillRect(-W, gy + cam, W * 3, 10 * s);

    blocks.forEach((b, i) => {
      const y = levelY(i);
      if (y > H + bh || y < -bh * 2 / zoom - H) return;
      drawBlock(ox + b.x, y, b.w, b.hue);
    });
    for (const p of pops) {
      // a ring flashes off a perfect drop
      const k = 1 - p.life / 0.5, grow = k * 16 * s;
      ctx.strokeStyle = `rgba(255,255,255,${1 - k})`;
      ctx.lineWidth = 3 * s;
      roundRect(ox + p.x - p.w / 2 - grow, levelY(p.level) - grow, p.w + grow * 2, bh + grow * 2, 9 * s);
      ctx.stroke();
    }
    for (const d of debris) {
      const y = levelY(d.level) + d.dy;
      ctx.save();
      ctx.translate(ox + d.x + d.w / 2, y + bh / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -bh / 2, d.w, d.hue, 0.85);
      ctx.restore();
    }
    if (cur) {
      const y = levelY(blocks.length);
      drawBlock(ox + cur.x, y, cur.w, cur.hue);
      // Nemo rides the block
      ctx.font = `${22 * s}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐠', ox + cur.x + cur.w / 2, y - 13 * s + Math.sin(t * 6) * 2 * s);
    }
    ctx.restore();

    // ---------- UI ----------
    if (state === 'play') {
      text(score, W / 2, 70 * s, 52 * s);
      if (perfect > 1) text(`PERFECT x${perfect}`, W / 2, 112 * s, 18 * s, '#ffd94a');
      if (banner) {
        ctx.globalAlpha = Math.min(1, banner.t / 0.4);
        text(banner.msg, W / 2, H * 0.3, 34 * s, '#ffd94a');
        ctx.globalAlpha = 1;
      }
    } else if (state === 'ready') {
      text("Nemo's", W / 2, H * 0.15, 38 * s, '#ffd94a');
      text('Reef Stack', W / 2, H * 0.22, 40 * s, '#ffd94a');
      text('Tap to drop the block', W / 2, H * 0.36, 22 * s);
      text('Line it up. Whatever hangs over is cut off.', W / 2, H * 0.41, Math.min(15 * s, W * 0.038), '#cdeef5');
      if (best > 0) text(`Best: ${best} floors`, W / 2, H * 0.47, 19 * s, '#ffd94a');
      text(VERSION, W / 2, H * 0.965, 12 * s, 'rgba(255,255,255,0.55)', 'rgba(0,0,0,0.25)');
    } else if (overT > 0.4) {
      ctx.fillStyle = 'rgba(0,0,20,0.4)';
      ctx.fillRect(0, 0, W, H * 0.3);
      text(`${score} ${score === 1 ? 'floor' : 'floors'}`, W / 2, H * 0.1, 40 * s, '#ffd94a');
      text(score >= best && score > 0 ? 'New record! 👑' : `Best: ${best}`, W / 2, H * 0.17, 20 * s, score >= best && score > 0 ? '#aef1b8' : '#fff');
      if (overT > 0.6 && Math.floor(overT * 2) % 2 === 0) text('Tap to try again', W / 2, H * 0.235, 20 * s);
    }
    home.style.display = state === 'play' ? 'none' : 'block';
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // a small window onto the game for automated play-testing
  window.__stack = {
    tap,
    get: () => ({
      state, score, best, perfect, overT,
      cur: cur && { x: cur.x, w: cur.w, dir: cur.dir, speed: cur.speed },
      top: { x: blocks[blocks.length - 1].x, w: blocks[blocks.length - 1].w },
      field: FIELD(), tol: PERFECT()
    })
  };

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
