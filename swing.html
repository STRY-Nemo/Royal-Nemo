<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kelp Swing">
<meta name="theme-color" content="#0d4a7a">
<title>Nemo's Kelp Swing 🐠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d4a7a;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
  }
  #game { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #home {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 5;
    font: bold 14px -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
    text-decoration: none;
    background: rgba(13, 50, 90, 0.7);
    border: 2px solid #ffd94a;
    border-radius: 18px;
    padding: 7px 14px;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="home" href="index.html">🐠 Nemo</a>
<script src="nemo-kit.js"></script>
<script>
(() => {
  const VERSION = 'swing v3';
  const K = window.NemoKit; // Nemo himself, his sounds and the five worlds
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const home = document.getElementById('home');

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // The world is simulated in design units (a 700-unit-tall screen), so the
  // physics are identical on every device; S() only scales the drawing.
  const S = () => H / 700;
  const VW = () => W / S();        // how many design units wide the screen is
  const GRAVITY = 1300;
  const RANGE = 360;               // how far the hook reaches
  const PUMP = 300;                // push along the swing while hooked
  const MAX_SPEED = 900;
  const FLOOR = 620;               // the urchin bed: touching it ends the run
  const R = 15;                    // the fish's size
  const METRE = 30;

  let state = 'ready';             // ready | play | over
  let fish, anchors, hazards, hook, rope, held, cam, t, overT, score, banner, bubbles, trail, x0, cause;
  const PUFFER_R = 20;
  let best = +(localStorage.getItem('kelpSwingBest') || 0);
  const board = K.board('swing', 'm'); // the shared Top 100

  function addAnchor() {
    const last = anchors[anchors.length - 1];
    // the sea gets harder with distance: hooks spread out and sit at more
    // varied heights, and pufferfish start drifting in the gaps between them
    const m = (last.x - x0) / METRE, far = Math.min(m / 600, 1);
    const a = {
      x: last.x + 190 + Math.random() * 70 + far * 110,
      y: 95 + Math.random() * (140 + far * 90),
      seed: Math.random() * 7
    };
    anchors.push(a);
    if (m > 120 && Math.random() < 0.15 + far * 0.45) {
      hazards.push({ x: (last.x + a.x) / 2 + (Math.random() - 0.5) * 60, y: 300 + Math.random() * 200, seed: Math.random() * 7 });
    }
  }
  function reset() {
    x0 = 150;
    hazards = [];
    cause = '';
    anchors = [{ x: x0 + 90, y: 150, seed: 1 }];
    while (anchors.length < 12) addAnchor();
    // start hanging from the first hook, already swinging
    hook = anchors[0];
    rope = 210;
    const a = -0.85;
    fish = { x: hook.x + Math.sin(a) * rope, y: hook.y + Math.cos(a) * rope, vx: 0, vy: 0 };
    held = false;
    cam = 0;
    t = 0;
    overT = 0;
    score = 0;
    banner = null;
    trail = [];
    bubbles = [];
    for (let i = 0; i < 14; i++) bubbles.push({ x: Math.random() * 1200, y: Math.random() * 700, r: 2 + Math.random() * 6, v: 14 + Math.random() * 26 });
    state = 'ready';
  }

  const beep = K.beep;
  const fx = K.fx(); // fart clouds and fireworks, in world units
  const WORLD_EVERY = 100; // metres per world
  const worldOf = m => Math.floor(m / WORLD_EVERY) % K.WORLDS.length;

  // ---------- the one control: hold to hook on, let go to fly ----------
  // the hook you would grab right now: the nearest one ahead, else the nearest at all
  function reachable() {
    let bestA = null, bestD = Infinity;
    for (const a of anchors) {
      const d = Math.hypot(a.x - fish.x, a.y - fish.y);
      if (d > RANGE) continue;
      const rank = a.x >= fish.x - 10 ? d : d + RANGE; // anything ahead beats anything behind
      if (rank < bestD) { bestD = rank; bestA = a; }
    }
    return bestA;
  }
  function press() {
    if (board.isOpen()) return;
    if (state === 'over') { if (overT > 0.6) reset(); return; }
    held = true;
    if (state === 'ready') { state = 'play'; K.loadFartSamples(); return; } // already hanging from the first hook
    if (hook) return;
    const a = reachable();
    if (!a) { beep(160, 0.08, 'square', 0.04); return; } // nothing in reach
    hook = a;
    rope = Math.max(60, Math.hypot(a.x - fish.x, a.y - fish.y));
    beep(620, 0.07, 'triangle', 0.07, 900);
  }
  function release() {
    if (!held) return;
    held = false;
    if (state !== 'play' || !hook) return;
    hook = null;
    // Nemo lets go with a fart: the kick that makes a well-timed release fly
    fish.vx *= 1.08;
    fish.vy = fish.vy * 1.08 - 50;
    const back = fish.vx < 0 ? 1 : -1;
    K.sndFart();
    fx.fart(fish.x + back * 20, fish.y + 6, 1, back, 7);
  }

  window.addEventListener('touchstart', e => { if (e.target !== canvas) return; e.preventDefault(); press(); }, { passive: false });
  window.addEventListener('touchend', e => { if (e.touches.length === 0) release(); });
  window.addEventListener('touchcancel', release);
  window.addEventListener('mousedown', e => { if (e.target === canvas) press(); });
  window.addEventListener('mouseup', release);
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); press(); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });
  window.addEventListener('blur', release);

  // ---------- update ----------
  function die(what) {
    cause = what;
    state = 'over';
    overT = 0;
    hook = null;
    held = false;
    K.sndHit();
    setTimeout(K.sndBlub, 250);
    setTimeout(() => K.playFartSample('proud', 0.9, 1), 450); // a long sad one to finish
    fx.fart(fish.x, fish.y + 8, 1, -1, 9);
    if (score > best) { best = score; localStorage.setItem('kelpSwingBest', best); }
    if (score >= best) board.submit(score); // a record, or a tie the board may have missed
  }
  function update(dt) {
    t += dt;
    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < -20) { b.y = 720; b.x = Math.random() * 1200; }
    }
    if (banner && (banner.t -= dt) <= 0) banner = null;
    fx.update(dt, 1);
    if (state === 'over') {
      overT += dt;
      // sink onto the seabed
      fish.vy += GRAVITY * dt;
      fish.y = Math.min(FLOOR - R * 0.5, fish.y + fish.vy * dt);
      fish.x += fish.vx * dt;
      fish.vx *= 1 - dt * 3;
      return;
    }

    fish.vy += GRAVITY * dt;
    if (hook) {
      // while hooked, a gentle push along the direction of travel builds the swing
      const nx = (fish.x - hook.x) / rope, ny = (fish.y - hook.y) / rope;
      const tx = -ny, ty = nx, along = fish.vx * tx + fish.vy * ty;
      const dir = along >= 0 ? 1 : -1;
      if (Math.hypot(fish.vx, fish.vy) < MAX_SPEED) { fish.vx += tx * dir * PUMP * dt; fish.vy += ty * dir * PUMP * dt; }
    }
    fish.x += fish.vx * dt;
    fish.y += fish.vy * dt;
    if (hook) {
      // the rope: never longer than it was when it caught
      const dx = fish.x - hook.x, dy = fish.y - hook.y, len = Math.hypot(dx, dy);
      if (len > rope) {
        const nx = dx / len, ny = dy / len;
        fish.x = hook.x + nx * rope;
        fish.y = hook.y + ny * rope;
        const out = fish.vx * nx + fish.vy * ny;
        if (out > 0) { fish.vx -= nx * out; fish.vy -= ny * out; }
      }
    }
    if (fish.y < R) { fish.y = R; fish.vy = Math.abs(fish.vy) * 0.3; } // the surface
    if (state === 'play' && fish.y > FLOOR - R) { fish.y = FLOOR - R; die('urchins'); return; }
    if (state === 'play') {
      for (const h of hazards) {
        const hy = h.y + Math.sin(t * 1.5 + h.seed) * 18; // they bob up and down
        if (Math.hypot(h.x - fish.x, hy - fish.y) < PUFFER_R + R * 0.7) { die('a pufferfish'); return; }
      }
    }

    while (anchors[anchors.length - 1].x < fish.x + VW() + 400) addAnchor();
    while (anchors.length > 3 && anchors[1].x < fish.x - VW()) anchors.shift();
    while (hazards.length && hazards[0].x < fish.x - VW()) hazards.shift();

    if (state === 'play') {
      const m = Math.floor((fish.x - x0) / METRE);
      if (m > score) {
        if (Math.floor(m / WORLD_EVERY) > Math.floor(score / WORLD_EVERY)) {
          // every 100 m Nemo swings into the next world of the main game
          const hundreds = Math.floor(m / WORLD_EVERY);
          banner = { msg: K.WORLDS[worldOf(m)].name, sub: `${hundreds * WORLD_EVERY} m!`, t: 2.2 };
          fx.fireworks(fish.x, fish.y, 1);
          if (hundreds % 3 === 0) { K.sndChest(); K.sndFartSong(Math.min(hundreds / 3, 4)); }
          else K.snd1Up();
        }
        score = m;
      }
      trail.push({ x: fish.x, y: fish.y, life: 0.5 });
    }
    for (const p of trail) p.life -= dt;
    trail = trail.filter(p => p.life > 0);
    cam += (fish.x - VW() * 0.32 - cam) * Math.min(1, dt * 6);
    if (state === 'ready') cam = 0;
  }

  // ---------- drawing ----------
  function text(str, x, y, size, fill = '#fff', stroke = '#123a5c') {
    ctx.font = `bold ${size}px -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 8);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }
  function draw() {
    const s = S(), vw = VW();
    const world = worldOf(score);
    K.drawBackdrop(ctx, W, H, world, cam * 0.25 * s, t);

    ctx.save();
    ctx.scale(s, s); // from here on, draw in design units
    for (const b of bubbles) {
      const bx = ((b.x - cam * 0.2) % 1200 + 1200) % 1200;
      if (world === 1) {
        // out in space the bubbles are stars
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath(); ctx.arc(bx, b.y, b.r * 0.3, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(bx, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // distant reef, drifting slower than the foreground
    ctx.fillStyle = 'rgba(10, 40, 80, 0.5)';
    ctx.beginPath();
    ctx.moveTo(0, FLOOR);
    for (let x = 0; x <= vw + 20; x += 16) ctx.lineTo(x, FLOOR - 50 - Math.sin((x + cam * 0.35) * 0.012) * 34 - Math.sin((x + cam * 0.35) * 0.031) * 14);
    ctx.lineTo(vw + 20, FLOOR);
    ctx.closePath();
    ctx.fill();

    ctx.save();
    ctx.translate(-cam, 0);
    // seabed with urchin spikes
    ctx.fillStyle = '#e8d59a';
    ctx.fillRect(cam - 10, FLOOR, vw + 20, 700 - FLOOR + 10);
    ctx.fillStyle = '#3b2a4a';
    const first = Math.floor(cam / 26) * 26;
    for (let x = first; x < cam + vw + 26; x += 26) {
      ctx.beginPath();
      ctx.moveTo(x, FLOOR + 4);
      ctx.lineTo(x + 13, FLOOR - 16 - (Math.abs(Math.sin(x * 0.37)) * 8));
      ctx.lineTo(x + 26, FLOOR + 4);
      ctx.closePath();
      ctx.fill();
    }

    // hooks: little glowing jellyfish; the one in reach lights up
    const next = state !== 'over' && !hook ? reachable() : null;
    for (const a of anchors) {
      if (a.x < cam - 60 || a.x > cam + vw + 60) continue;
      const on = a === hook || a === next, bob = Math.sin(t * 2 + a.seed) * 3;
      ctx.fillStyle = on ? 'rgba(255, 217, 74, 0.28)' : 'rgba(255, 150, 210, 0.16)';
      ctx.beginPath(); ctx.arc(a.x, a.y + bob, on ? 30 : 22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = on ? '#ffd94a' : '#ff9ad2';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(a.x + i * 6, a.y + bob + 4);
        ctx.quadraticCurveTo(a.x + i * 8 + Math.sin(t * 3 + a.seed + i) * 3, a.y + bob + 14, a.x + i * 6, a.y + bob + 22);
        ctx.stroke();
      }
      ctx.fillStyle = on ? '#ffd94a' : '#ff9ad2';
      ctx.beginPath(); ctx.arc(a.x, a.y + bob, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
    }
    // pufferfish: don't touch
    for (const h of hazards) {
      if (h.x < cam - 60 || h.x > cam + vw + 60) continue;
      const hy = h.y + Math.sin(t * 1.5 + h.seed) * 18;
      ctx.fillStyle = 'rgba(255, 90, 90, 0.18)';
      ctx.beginPath(); ctx.arc(h.x, hy, PUFFER_R + 8, 0, Math.PI * 2); ctx.fill();
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐡', h.x, hy + 1);
    }
    // the kelp rope
    if (hook) {
      ctx.strokeStyle = '#4ccf7a';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hook.x, hook.y); ctx.lineTo(fish.x, fish.y); ctx.stroke();
    }
    for (const p of trail) {
      ctx.fillStyle = `rgba(255,255,255,${p.life * 0.5})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life * 2, 0, Math.PI * 2); ctx.fill();
    }
    fx.drawFarts(ctx);
    // Nemo, crown and shades on, nose pointing where he is going
    ctx.save();
    ctx.translate(fish.x, fish.y);
    const facing = fish.vx < -60 ? -1 : 1;
    ctx.scale(facing, 1);
    ctx.rotate(state === 'over' ? Math.PI / 2 : Math.atan2(fish.vy, Math.max(160, Math.abs(fish.vx))));
    ctx.scale(1.15, 1.15);
    K.drawNemo(ctx, { tail: t * (hook ? 9 : 6), fin: hook ? 1 : (Math.sin(t * 8) + 1) / 2, dead: state === 'over', rave: world === 3, t });
    ctx.restore();
    fx.drawSparks(ctx, 1);
    ctx.restore(); // camera
    ctx.restore(); // design units

    // ---------- UI ----------
    if (state === 'play') {
      text(score + ' m', W / 2, 70 * s, 46 * s);
      if (score < 12) text(hook ? 'let go to fart away!' : 'HOLD to hook on', W / 2, H * 0.94, 18 * s, '#ffd94a');
      if (banner) {
        ctx.globalAlpha = Math.min(1, banner.t / 0.4);
        text(banner.msg, W / 2, H * 0.18, Math.min(32 * s, W * 0.075), '#ffd94a');
        if (banner.sub) text(banner.sub, W / 2, H * 0.235, 19 * s);
        ctx.globalAlpha = 1;
      }
    } else if (state === 'ready') {
      text("Nemo's Kelp Swing", W / 2, H * 0.1, Math.min(34 * s, W * 0.082), '#ffd94a');
      text('HOLD to hook on · LET GO to fart away', W / 2, H * 0.66, Math.min(19 * s, W * 0.046));
      text('Swing from jellyfish to jellyfish. Mind the urchins!', W / 2, H * 0.71, Math.min(14 * s, W * 0.036), '#cdeef5');
      if (best > 0) text(`Best: ${best} m`, W / 2, H * 0.76, 19 * s, '#ffd94a');
      text(board.line(), W / 2, H * 0.8, Math.min(15 * s, W * 0.038), '#aef1b8');
      text('🔊 Sound ON highly recommended', W / 2, H * 0.85, Math.min(16 * s, W * 0.046), '#ffe34d');
      text('for the laughs... trust us.', W / 2, H * 0.885, Math.min(14 * s, W * 0.042), '#cdeef5');
      text(VERSION, W / 2, H * 0.965, 12 * s, 'rgba(255,255,255,0.55)', 'rgba(0,0,0,0.25)');
    } else if (overT > 0.4) {
      ctx.fillStyle = 'rgba(0,0,20,0.45)';
      ctx.fillRect(0, 0, W, H);
      text('Blub... Game Over', W / 2, H * 0.22, Math.min(34 * s, W * 0.085), '#ff8b6b');
      text(`Ouch, ${cause}!`, W / 2, H * 0.3, Math.min(20 * s, W * 0.05), '#cdeef5');
      text(`${score} m`, W / 2, H * 0.4, 44 * s, '#ffd94a');
      text(score >= best && score > 0 ? 'New record! 👑' : `Best: ${best} m`, W / 2, H * 0.48, 20 * s, score >= best && score > 0 ? '#aef1b8' : '#fff');
      text(board.line(), W / 2, H * 0.55, Math.min(15 * s, W * 0.038), '#aef1b8');
      if (overT > 0.6 && Math.floor(overT * 2) % 2 === 0) text('Tap to try again', W / 2, H * 0.64, 22 * s);
    }
    home.style.display = state === 'play' ? 'none' : 'block';
    board.show(state !== 'play');
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // a small window onto the game for automated play-testing
  window.__swing = {
    press, release,
    get: () => {
      const a = hook ? null : reachable();
      return {
        state, score, best, overT, held, rope,
        fish: { ...fish },
        hook: hook && { x: hook.x, y: hook.y },
        next: a && { x: a.x, y: a.y },
        cause, hazards: hazards.length, world: worldOf(score),
        floor: FLOOR
      };
    }
  };

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
