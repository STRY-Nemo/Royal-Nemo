<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cass' Tappy">
<meta name="theme-color" content="#87ceeb">
<title>Cass' Tappy Adventure 🐱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #4ec0ca;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- Sizing (crisp on Retina) ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // ---------- Game constants (scaled to screen height) ----------
  const S = () => H / 700; // scale factor relative to a 700px-tall design
  const GRAVITY = 1500;
  const FLAP_VY = -480;
  const PIPE_SPEED = 160;
  const PIPE_GAP = 185;
  const PIPE_W = 70;
  const PIPE_SPACING = 240;
  const GROUND_H = 90;
  const KITTY_R = 19; // collision radius

  // ---------- State ----------
  const ST = { READY: 0, PLAYING: 1, DEAD: 2 };
  let state = ST.READY;
  let kitty, pipes, score, best, t, deathT, flashT, clouds, stars;
  best = +(localStorage.getItem('flappyKittyBest') || 0);

  function reset() {
    kitty = { x: W * 0.3, y: H * 0.45, vy: 0, rot: 0, wing: 0, tail: 0 };
    pipes = [];
    score = 0;
    t = 0;
    deathT = 0;
    flashT = 0;
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.5,
        s: (0.5 + Math.random()) * S(),
        v: 10 + Math.random() * 18
      });
    }
    stars = []; // celebration particles on point scored
    state = ST.READY;
  }

  // ---------- Sound (tiny WebAudio bleeps, no assets) ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio is optional */ }
  }
  const sndFlap = () => beep(500, 0.08, 'triangle', 0.1, 800);
  const sndScore = () => { beep(880, 0.08, 'square', 0.06); setTimeout(() => beep(1320, 0.12, 'square', 0.06), 80); };
  const sndHit = () => beep(220, 0.25, 'sawtooth', 0.12, 60);
  const sndMeow = () => beep(700, 0.18, 'triangle', 0.09, 350);

  // ---------- Input ----------
  function flap() {
    if (state === ST.READY) {
      state = ST.PLAYING;
      kitty.vy = FLAP_VY * S();
      sndFlap();
    } else if (state === ST.PLAYING) {
      kitty.vy = FLAP_VY * S();
      kitty.wing = 1;
      sndFlap();
    } else if (state === ST.DEAD && deathT > 0.6) {
      reset();
    }
  }
  window.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, { passive: false });
  window.addEventListener('mousedown', flap);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });

  // ---------- Pipes ----------
  function spawnPipe(x) {
    const s = S();
    const gap = PIPE_GAP * s;
    const margin = 70 * s;
    const groundY = H - GROUND_H * s;
    const gapY = margin + Math.random() * (groundY - margin * 2 - gap);
    pipes.push({ x, gapY, gap, scored: false });
  }

  // ---------- Update ----------
  function update(dt) {
    const s = S();
    t += dt;

    for (const c of clouds) {
      c.x -= c.v * dt * (state === ST.DEAD ? 0.3 : 1);
      if (c.x < -120 * c.s) { c.x = W + 120 * c.s; c.y = Math.random() * H * 0.5; }
    }

    kitty.tail += dt * 6;

    if (state === ST.READY) {
      kitty.y = H * 0.45 + Math.sin(t * 3) * 12 * s;
      kitty.wing = (Math.sin(t * 8) + 1) / 2;
      return;
    }

    if (state === ST.DEAD) {
      deathT += dt;
      flashT = Math.max(0, flashT - dt * 3);
      // fall to the ground
      const groundY = H - GROUND_H * s;
      if (kitty.y < groundY - KITTY_R * s) {
        kitty.vy += GRAVITY * s * dt;
        kitty.y += kitty.vy * dt;
        kitty.rot = Math.min(kitty.rot + dt * 6, Math.PI / 2);
        if (kitty.y > groundY - KITTY_R * s) kitty.y = groundY - KITTY_R * s;
      }
      updateStars(dt);
      return;
    }

    // PLAYING
    kitty.vy += GRAVITY * s * dt;
    kitty.y += kitty.vy * dt;
    kitty.rot = Math.max(-0.45, Math.min(1.2, kitty.vy / (600 * s)));
    kitty.wing = Math.max(0, kitty.wing - dt * 4);

    // pipes
    for (const p of pipes) p.x -= PIPE_SPEED * s * dt;
    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING * s) {
      spawnPipe(Math.max(W + 40, pipes.length ? pipes[pipes.length - 1].x + PIPE_SPACING * s : W + 40));
    }
    while (pipes.length && pipes[0].x < -PIPE_W * s - 20) pipes.shift();

    const r = KITTY_R * s;
    const groundY = H - GROUND_H * s;

    // score + collisions
    for (const p of pipes) {
      const pw = PIPE_W * s;
      if (!p.scored && p.x + pw < kitty.x) {
        p.scored = true;
        score++;
        sndScore();
        burstStars();
      }
      // circle vs pipe rects
      if (kitty.x + r > p.x && kitty.x - r < p.x + pw) {
        if (kitty.y - r < p.gapY || kitty.y + r > p.gapY + p.gap) {
          die();
          break;
        }
      }
    }

    // ground & ceiling
    if (kitty.y + r > groundY) { kitty.y = groundY - r; die(); }
    if (kitty.y - r < 0) { kitty.y = r; kitty.vy = 50; }

    updateStars(dt);
  }

  function die() {
    if (state === ST.DEAD) return;
    state = ST.DEAD;
    flashT = 1;
    kitty.vy = Math.min(kitty.vy, 0);
    sndHit();
    setTimeout(sndMeow, 250);
    if (score > best) {
      best = score;
      localStorage.setItem('flappyKittyBest', best);
    }
  }

  function burstStars() {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      stars.push({
        x: kitty.x, y: kitty.y,
        vx: Math.cos(a) * (60 + Math.random() * 120),
        vy: Math.sin(a) * (60 + Math.random() * 120) - 60,
        life: 0.6 + Math.random() * 0.3
      });
    }
  }
  function updateStars(dt) {
    for (const st of stars) {
      st.x += st.vx * dt;
      st.y += st.vy * dt;
      st.vy += 400 * dt;
      st.life -= dt;
    }
    stars = stars.filter(st => st.life > 0);
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const s = S();
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#6ad7f0');
    sky.addColorStop(0.7, '#b8ecf5');
    sky.addColorStop(1, '#d9f6e8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // sun
    ctx.fillStyle = 'rgba(255, 240, 160, 0.9)';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.13, 36 * s, 0, Math.PI * 2);
    ctx.fill();

    // clouds
    for (const c of clouds) drawCloud(c.x, c.y, c.s);

    // distant hills
    ctx.fillStyle = '#a5e3b2';
    ctx.beginPath();
    ctx.moveTo(0, H - GROUND_H * s);
    for (let x = 0; x <= W; x += 8) {
      ctx.lineTo(x, H - GROUND_H * s - 30 * s - Math.sin(x * 0.01 + 2) * 22 * s);
    }
    ctx.lineTo(W, H - GROUND_H * s);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, sc) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 22 * sc, 0, Math.PI * 2);
    ctx.arc(x + 24 * sc, y - 8 * sc, 18 * sc, 0, Math.PI * 2);
    ctx.arc(x + 48 * sc, y, 20 * sc, 0, Math.PI * 2);
    ctx.arc(x + 24 * sc, y + 8 * sc, 18 * sc, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    const s = S();
    const gy = H - GROUND_H * s;
    ctx.fillStyle = '#8bd06b';
    ctx.fillRect(0, gy, W, GROUND_H * s);
    ctx.fillStyle = '#79c25a';
    ctx.fillRect(0, gy, W, 12 * s);
    // scrolling stripes
    const off = (state !== ST.DEAD ? (t * PIPE_SPEED * s) % (40 * s) : 0);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let x = -off; x < W; x += 40 * s) {
      ctx.beginPath();
      ctx.moveTo(x, gy + 12 * s);
      ctx.lineTo(x + 20 * s, gy + 12 * s);
      ctx.lineTo(x + 8 * s, gy + GROUND_H * s);
      ctx.lineTo(x - 12 * s, gy + GROUND_H * s);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawPipe(p) {
    const s = S();
    const pw = PIPE_W * s;
    const gy = H - GROUND_H * s;
    const lip = 14 * s;

    // styled as yarn-spool towers
    const body = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
    body.addColorStop(0, '#e8743c');
    body.addColorStop(0.5, '#ff9a5c');
    body.addColorStop(1, '#d6602e');

    // top tower
    ctx.fillStyle = body;
    ctx.fillRect(p.x, 0, pw, p.gapY - lip);
    roundRect(p.x - 5 * s, p.gapY - lip, pw + 10 * s, lip, 5 * s);
    // bottom tower
    ctx.fillRect(p.x, p.gapY + p.gap + lip, pw, gy - (p.gapY + p.gap + lip));
    roundRect(p.x - 5 * s, p.gapY + p.gap, pw + 10 * s, lip, 5 * s);

    // yarn winding lines
    ctx.strokeStyle = 'rgba(120, 40, 10, 0.25)';
    ctx.lineWidth = 2 * s;
    for (let y = 10 * s; y < p.gapY - lip; y += 14 * s) {
      ctx.beginPath();
      ctx.moveTo(p.x + 3 * s, y);
      ctx.quadraticCurveTo(p.x + pw / 2, y + 6 * s, p.x + pw - 3 * s, y);
      ctx.stroke();
    }
    for (let y = p.gapY + p.gap + lip + 10 * s; y < gy; y += 14 * s) {
      ctx.beginPath();
      ctx.moveTo(p.x + 3 * s, y);
      ctx.quadraticCurveTo(p.x + pw / 2, y + 6 * s, p.x + pw - 3 * s, y);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawKitty() {
    const s = S();
    const k = kitty;
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.rot);
    ctx.scale(s, s);

    // Cass: gray-brown tabby, white bib + socks, green eyes
    const fur = '#a08c74';
    const furDark = '#5f4f3c';
    const cream = '#fdf7ec';

    // tail (wavy, with tabby rings)
    ctx.lineCap = 'round';
    const tw = Math.sin(k.tail) * 6;
    const tailPath = () => {
      ctx.beginPath();
      ctx.moveTo(-16, 4);
      ctx.quadraticCurveTo(-30, 0 + tw, -34, -10 + tw);
    };
    ctx.strokeStyle = fur;
    ctx.lineWidth = 7;
    tailPath();
    ctx.stroke();
    ctx.strokeStyle = furDark;
    ctx.lineWidth = 7;
    ctx.setLineDash([3, 5]);
    tailPath();
    ctx.stroke();
    ctx.setLineDash([]);

    // wing (white, flaps)
    const wingUp = -10 - kitty.wing * 16;
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(-4, -2);
    ctx.quadraticCurveTo(-18, wingUp, -28, wingUp + 4);
    ctx.quadraticCurveTo(-20, 2, -4, 4);
    ctx.closePath();
    ctx.fill();

    // body
    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.ellipse(-4, 4, 16, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    // body tabby stripes
    ctx.strokeStyle = furDark;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, -3); ctx.quadraticCurveTo(-12, 2, -14, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8, -6); ctx.quadraticCurveTo(-6, 0, -8, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2, -7); ctx.quadraticCurveTo(0, -2, -2, 3); ctx.stroke();

    // white bib (chest)
    ctx.fillStyle = cream;
    ctx.beginPath();
    ctx.ellipse(2, 8, 9, 8, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // white front paw
    ctx.fillStyle = cream;
    ctx.beginPath();
    ctx.ellipse(6, 15, 4.5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // head
    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.arc(10, -6, 13, 0, Math.PI * 2);
    ctx.fill();

    // ears
    ctx.beginPath();
    ctx.moveTo(2, -14); ctx.lineTo(0, -25); ctx.lineTo(9, -17);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(13, -17); ctx.lineTo(18, -27); ctx.lineTo(21, -14);
    ctx.closePath(); ctx.fill();
    // inner ears
    ctx.fillStyle = '#ff9eb0';
    ctx.beginPath();
    ctx.moveTo(3.5, -16); ctx.lineTo(2.5, -22); ctx.lineTo(8, -17.5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14.5, -17.5); ctx.lineTo(17.5, -24); ctx.lineTo(19.5, -15.5);
    ctx.closePath(); ctx.fill();

    // forehead tabby "M"
    ctx.strokeStyle = furDark;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(8, -17); ctx.lineTo(8.5, -12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -18); ctx.lineTo(12, -12.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(16, -17); ctx.lineTo(15.5, -12); ctx.stroke();
    // cheek stripes
    ctx.beginPath(); ctx.moveTo(22, -12); ctx.lineTo(19, -10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(23, -8); ctx.lineTo(20, -7); ctx.stroke();

    // white muzzle
    ctx.fillStyle = cream;
    ctx.beginPath();
    ctx.ellipse(13.5, 0, 6.5, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // eyes
    const dead = state === ST.DEAD;
    if (dead) {
      ctx.strokeStyle = '#3a2a16';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(11, -5); ctx.moveTo(11, -10); ctx.lineTo(6, -5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15, -10); ctx.lineTo(20, -5); ctx.moveTo(20, -10); ctx.lineTo(15, -5); ctx.stroke();
    } else {
      // big green eyes like Cass
      ctx.fillStyle = '#9db657';
      ctx.beginPath(); ctx.arc(8.5, -7.5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(17.5, -7.5, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#26221a';
      ctx.beginPath(); ctx.arc(8.8, -7.3, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(17.8, -7.3, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9.5, -8.5, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(18.5, -8.5, 1, 0, Math.PI * 2); ctx.fill();
    }

    // nose + mouth
    ctx.fillStyle = '#d98a80';
    ctx.beginPath();
    ctx.moveTo(12, -2.5); ctx.lineTo(15, -2.5); ctx.lineTo(13.5, -0.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2a16';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(13.5, -0.5);
    ctx.quadraticCurveTo(13.5, 2, 11, 2);
    ctx.moveTo(13.5, -0.5);
    ctx.quadraticCurveTo(13.5, 2, 16, 2);
    ctx.stroke();

    // whiskers
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(4, -2); ctx.lineTo(-3, -3);
    ctx.moveTo(4, 0); ctx.lineTo(-3, 1);
    ctx.moveTo(22, -2); ctx.lineTo(29, -3);
    ctx.moveTo(22, 0); ctx.lineTo(29, 1);
    ctx.stroke();

    ctx.restore();
  }

  function drawStars() {
    ctx.fillStyle = '#ffd94a';
    for (const st of stars) {
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.life * 8);
      ctx.globalAlpha = Math.min(1, st.life * 2);
      const r = 5 * S();
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, fill = '#fff', stroke = '#4a3621', align = 'center') {
    ctx.font = `bold ${size}px -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 8);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawUI() {
    const s = S();
    const safeTop = 40 * s + (window.visualViewport ? 0 : 0);

    if (state === ST.PLAYING) {
      text(score, W / 2, safeTop + 30 * s, 52 * s);
    } else if (state === ST.READY) {
      text("Cass' Tappy", W / 2, H * 0.19, 40 * s, '#ffd94a');
      text('Adventure', W / 2, H * 0.26, 40 * s, '#ffd94a');
      text('🐾', W / 2, H * 0.32, 26 * s);
      text('Tap to flap!', W / 2, H * 0.62, 26 * s);
      if (best > 0) text(`Best: ${best}`, W / 2, H * 0.68, 20 * s, '#ffe9c9');
    } else if (state === ST.DEAD) {
      // flash on hit
      if (flashT > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashT * 0.6})`;
        ctx.fillRect(0, 0, W, H);
      }
      if (deathT > 0.4) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 0, W, H);
        text('Game Over', W / 2, H * 0.3, 44 * s, '#ff8b6b');
        text(`Score: ${score}`, W / 2, H * 0.42, 32 * s);
        text(`Best: ${best}`, W / 2, H * 0.49, 24 * s, '#ffd94a');
        if (score >= best && score > 0) text('New record! 🎉', W / 2, H * 0.56, 22 * s, '#aef1b8');
        if (deathT > 0.6 && Math.floor(deathT * 2) % 2 === 0) {
          text('Tap to try again', W / 2, H * 0.68, 22 * s);
        }
      }
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;

    update(dt);

    drawBackground();
    for (const p of pipes) drawPipe(p);
    drawGround();
    drawStars();
    drawKitty();
    drawUI();

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
