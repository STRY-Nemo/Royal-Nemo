<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royal Nemo">
<meta name="theme-color" content="#1a6ea8">
<title>Royal Nemo's Reef Adventure 🐠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a6ea8;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    position: fixed;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // ---------- Sizing (crisp on Retina) ----------
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // ---------- Game constants (scaled to screen height) ----------
  const S = () => H / 700; // scale factor relative to a 700px-tall design
  const GRAVITY = 1300;      // a touch lighter than air — we're underwater
  const SWIM_VY = -440;
  const CORAL_SPEED = 160;
  const CORAL_GAP = 185;
  const CORAL_W = 70;
  const CORAL_SPACING = 240;
  const SEABED_H = 90;
  const NEMO_R = 19; // collision radius

  // ---------- State ----------
  const ST = { READY: 0, PLAYING: 1, DEAD: 2 };
  let state = ST.READY;
  let nemo, corals, score, best, t, deathT, flashT, drift, sparkles;
  best = +(localStorage.getItem('royalNemoBest') || 0);

  function reset() {
    nemo = { x: W * 0.3, y: H * 0.45, vy: 0, rot: 0, fin: 0, tail: 0 };
    corals = [];
    score = 0;
    t = 0;
    deathT = 0;
    flashT = 0;
    drift = []; // ambient bubbles drifting up through the water
    for (let i = 0; i < 10; i++) {
      drift.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: (0.4 + Math.random()) * S(),
        v: 18 + Math.random() * 26
      });
    }
    sparkles = []; // celebration bubbles on point scored
    state = ST.READY;
  }

  // ---------- Sound (tiny WebAudio bleeps, no assets) ----------
  let actx = null;
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, actx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime + dur);
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) { /* audio is optional */ }
  }
  const sndSwim = () => beep(350, 0.1, 'sine', 0.1, 900);
  const sndScore = () => { beep(880, 0.08, 'triangle', 0.07); setTimeout(() => beep(1320, 0.12, 'triangle', 0.07), 80); };
  const sndHit = () => beep(180, 0.3, 'sawtooth', 0.12, 50);
  const sndBlub = () => beep(300, 0.25, 'sine', 0.09, 90);

  // ---------- Input ----------
  function swim() {
    if (state === ST.READY) {
      state = ST.PLAYING;
      nemo.vy = SWIM_VY * S();
      sndSwim();
    } else if (state === ST.PLAYING) {
      nemo.vy = SWIM_VY * S();
      nemo.fin = 1;
      sndSwim();
    } else if (state === ST.DEAD && deathT > 0.6) {
      reset();
    }
  }
  window.addEventListener('touchstart', e => { e.preventDefault(); swim(); }, { passive: false });
  window.addEventListener('mousedown', swim);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); swim(); }
  });

  // ---------- Coral columns ----------
  function spawnCoral(x) {
    const s = S();
    const gap = CORAL_GAP * s;
    const margin = 70 * s;
    const seabedY = H - SEABED_H * s;
    const gapY = margin + Math.random() * (seabedY - margin * 2 - gap);
    corals.push({ x, gapY, gap, scored: false });
  }

  // ---------- Update ----------
  function update(dt) {
    const s = S();
    t += dt;

    for (const b of drift) {
      b.y -= b.v * dt * (state === ST.DEAD ? 0.3 : 1);
      b.x += Math.sin(t * 2 + b.y * 0.02) * 12 * dt;
      if (b.y < -20 * b.s) { b.y = H + 20 * b.s; b.x = Math.random() * W; }
    }

    nemo.tail += dt * 7;

    if (state === ST.READY) {
      nemo.y = H * 0.45 + Math.sin(t * 3) * 12 * s;
      nemo.fin = (Math.sin(t * 8) + 1) / 2;
      return;
    }

    if (state === ST.DEAD) {
      deathT += dt;
      flashT = Math.max(0, flashT - dt * 3);
      // sink to the seabed
      const seabedY = H - SEABED_H * s;
      if (nemo.y < seabedY - NEMO_R * s) {
        nemo.vy += GRAVITY * s * dt;
        nemo.y += nemo.vy * dt;
        nemo.rot = Math.min(nemo.rot + dt * 6, Math.PI / 2);
        if (nemo.y > seabedY - NEMO_R * s) nemo.y = seabedY - NEMO_R * s;
      }
      updateSparkles(dt);
      return;
    }

    // PLAYING
    nemo.vy += GRAVITY * s * dt;
    nemo.y += nemo.vy * dt;
    nemo.rot = Math.max(-0.45, Math.min(1.2, nemo.vy / (600 * s)));
    nemo.fin = Math.max(0, nemo.fin - dt * 4);

    // coral columns
    for (const p of corals) p.x -= CORAL_SPEED * s * dt;
    if (corals.length === 0 || corals[corals.length - 1].x < W - CORAL_SPACING * s) {
      spawnCoral(Math.max(W + 40, corals.length ? corals[corals.length - 1].x + CORAL_SPACING * s : W + 40));
    }
    while (corals.length && corals[0].x < -CORAL_W * s - 20) corals.shift();

    const r = NEMO_R * s;
    const seabedY = H - SEABED_H * s;

    // score + collisions
    for (const p of corals) {
      const pw = CORAL_W * s;
      if (!p.scored && p.x + pw < nemo.x) {
        p.scored = true;
        score++;
        sndScore();
        burstSparkles();
      }
      // circle vs coral rects
      if (nemo.x + r > p.x && nemo.x - r < p.x + pw) {
        if (nemo.y - r < p.gapY || nemo.y + r > p.gapY + p.gap) {
          die();
          break;
        }
      }
    }

    // seabed & surface
    if (nemo.y + r > seabedY) { nemo.y = seabedY - r; die(); }
    if (nemo.y - r < 0) { nemo.y = r; nemo.vy = 50; }

    updateSparkles(dt);
  }

  function die() {
    if (state === ST.DEAD) return;
    state = ST.DEAD;
    flashT = 1;
    nemo.vy = Math.min(nemo.vy, 0);
    sndHit();
    setTimeout(sndBlub, 250);
    if (score > best) {
      best = score;
      localStorage.setItem('royalNemoBest', best);
    }
  }

  function burstSparkles() {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      sparkles.push({
        x: nemo.x, y: nemo.y,
        vx: Math.cos(a) * (60 + Math.random() * 120),
        vy: Math.sin(a) * (60 + Math.random() * 120) - 60,
        life: 0.6 + Math.random() * 0.3
      });
    }
  }
  function updateSparkles(dt) {
    for (const sp of sparkles) {
      sp.x += sp.vx * dt;
      sp.y += sp.vy * dt;
      sp.vy -= 250 * dt; // bubbles float upward
      sp.life -= dt;
    }
    sparkles = sparkles.filter(sp => sp.life > 0);
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const s = S();
    const water = ctx.createLinearGradient(0, 0, 0, H);
    water.addColorStop(0, '#39a9d8');
    water.addColorStop(0.6, '#1a6ea8');
    water.addColorStop(1, '#0d4a7a');
    ctx.fillStyle = water;
    ctx.fillRect(0, 0, W, H);

    // shafts of sunlight filtering down
    ctx.fillStyle = 'rgba(255, 250, 200, 0.08)';
    for (let i = 0; i < 3; i++) {
      const bx = W * (0.18 + i * 0.3) + Math.sin(t * 0.4 + i * 2) * 30 * s;
      ctx.beginPath();
      ctx.moveTo(bx - 18 * s, 0);
      ctx.lineTo(bx + 18 * s, 0);
      ctx.lineTo(bx + 90 * s, H);
      ctx.lineTo(bx - 90 * s, H);
      ctx.closePath();
      ctx.fill();
    }

    // ambient bubbles
    for (const b of drift) drawBubble(b.x, b.y, b.s);

    // distant reef silhouette
    ctx.fillStyle = 'rgba(10, 50, 90, 0.55)';
    ctx.beginPath();
    ctx.moveTo(0, H - SEABED_H * s);
    for (let x = 0; x <= W; x += 8) {
      ctx.lineTo(x, H - SEABED_H * s - 30 * s - Math.sin(x * 0.01 + 2) * 22 * s);
    }
    ctx.lineTo(W, H - SEABED_H * s);
    ctx.closePath();
    ctx.fill();
  }

  function drawBubble(x, y, sc) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1.5 * sc;
    ctx.beginPath();
    ctx.arc(x, y, 9 * sc, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(x - 3 * sc, y - 3 * sc, 2.2 * sc, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSeabed() {
    const s = S();
    const gy = H - SEABED_H * s;
    ctx.fillStyle = '#e8d59a';
    ctx.fillRect(0, gy, W, SEABED_H * s);
    ctx.fillStyle = '#d9c280';
    ctx.fillRect(0, gy, W, 12 * s);
    // scrolling sand ripples
    const off = (state !== ST.DEAD ? (t * CORAL_SPEED * s) % (40 * s) : 0);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let x = -off; x < W; x += 40 * s) {
      ctx.beginPath();
      ctx.moveTo(x, gy + 12 * s);
      ctx.lineTo(x + 20 * s, gy + 12 * s);
      ctx.lineTo(x + 8 * s, gy + SEABED_H * s);
      ctx.lineTo(x - 12 * s, gy + SEABED_H * s);
      ctx.closePath();
      ctx.fill();
    }
    // a few seaweed tufts swaying
    ctx.strokeStyle = '#2e8b57';
    ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const sx = ((i * 0.23 + 0.08) * W + (state !== ST.DEAD ? -(t * CORAL_SPEED * s * 0.25) : 0)) % (W + 40 * s);
      const wx = sx < 0 ? sx + W + 40 * s : sx;
      const sway = Math.sin(t * 2 + i * 1.7) * 6 * s;
      ctx.lineWidth = 4 * s;
      ctx.beginPath();
      ctx.moveTo(wx, gy + 10 * s);
      ctx.quadraticCurveTo(wx + sway, gy - 14 * s, wx + sway * 1.6, gy - 26 * s);
      ctx.stroke();
    }
  }

  function drawCoral(p) {
    const s = S();
    const pw = CORAL_W * s;
    const gy = H - SEABED_H * s;
    const lip = 14 * s;

    // styled as pink coral towers
    const body = ctx.createLinearGradient(p.x, 0, p.x + pw, 0);
    body.addColorStop(0, '#d8527c');
    body.addColorStop(0.5, '#ff7fa5');
    body.addColorStop(1, '#c2406a');

    // top tower
    ctx.fillStyle = body;
    ctx.fillRect(p.x, 0, pw, p.gapY - lip);
    roundRect(p.x - 5 * s, p.gapY - lip, pw + 10 * s, lip, 5 * s);
    // bottom tower
    ctx.fillRect(p.x, p.gapY + p.gap + lip, pw, gy - (p.gapY + p.gap + lip));
    roundRect(p.x - 5 * s, p.gapY + p.gap, pw + 10 * s, lip, 5 * s);

    // coral ridge lines
    ctx.strokeStyle = 'rgba(110, 20, 50, 0.25)';
    ctx.lineWidth = 2 * s;
    for (let y = 10 * s; y < p.gapY - lip; y += 14 * s) {
      ctx.beginPath();
      ctx.moveTo(p.x + 3 * s, y);
      ctx.quadraticCurveTo(p.x + pw / 2, y + 6 * s, p.x + pw - 3 * s, y);
      ctx.stroke();
    }
    for (let y = p.gapY + p.gap + lip + 10 * s; y < gy; y += 14 * s) {
      ctx.beginPath();
      ctx.moveTo(p.x + 3 * s, y);
      ctx.quadraticCurveTo(p.x + pw / 2, y + 6 * s, p.x + pw - 3 * s, y);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawNemo() {
    const k = nemo;
    const s = S();
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.rot);
    ctx.scale(s, s);

    // Royal Nemo: orange clownfish, white bands, golden crown
    const orange = '#ff8c2e';
    const orangeDark = '#d96a10';
    const band = '#fdf7ec';

    // tail fin (wags)
    const tw = Math.sin(k.tail) * 5;
    ctx.fillStyle = orange;
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-26, -12 + tw, -30, -8 + tw);
    ctx.quadraticCurveTo(-24, 0 + tw * 0.5, -30, 8 + tw);
    ctx.quadraticCurveTo(-26, 12 + tw, -14, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = orangeDark;
    ctx.lineWidth = 2;
    ctx.stroke();

    // dorsal fin
    ctx.fillStyle = orange;
    ctx.beginPath();
    ctx.moveTo(-6, -10);
    ctx.quadraticCurveTo(-2, -20, 8, -12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = orangeDark;
    ctx.stroke();

    // body
    ctx.fillStyle = orange;
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = orangeDark;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // white bands with dark edges (clip to body)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = band;
    ctx.strokeStyle = '#3a2a16';
    ctx.lineWidth = 1.2;
    // head band
    ctx.beginPath();
    ctx.moveTo(8, -13); ctx.quadraticCurveTo(4, 0, 8, 13);
    ctx.lineTo(13, 13); ctx.quadraticCurveTo(9, 0, 13, -13);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // middle band
    ctx.beginPath();
    ctx.moveTo(-3, -13); ctx.quadraticCurveTo(-7, 0, -3, 13);
    ctx.lineTo(3, 13); ctx.quadraticCurveTo(-1, 0, 3, -13);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // tail band
    ctx.beginPath();
    ctx.moveTo(-13, -13); ctx.quadraticCurveTo(-16, 0, -13, 13);
    ctx.lineTo(-10, 13); ctx.quadraticCurveTo(-13, 0, -10, -13);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();

    // pectoral fin (flaps on tap)
    const finUp = k.fin * 10;
    ctx.fillStyle = orangeDark;
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.quadraticCurveTo(-6, 10 - finUp, -12, 12 - finUp);
    ctx.quadraticCurveTo(-5, 12, 0, 7);
    ctx.closePath();
    ctx.fill();

    // black & gold royal crown
    ctx.fillStyle = '#1c1c1e';
    ctx.strokeStyle = '#d4a532';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(5, -13);
    ctx.lineTo(6, -21);
    ctx.lineTo(9.5, -16);
    ctx.lineTo(12.5, -23);
    ctx.lineTo(15.5, -16);
    ctx.lineTo(19, -21);
    ctx.lineTo(20, -13);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // gold band at the base
    ctx.fillStyle = '#d4a532';
    ctx.fillRect(5, -14, 15, 1.8);
    // gold tips on the points
    ctx.beginPath(); ctx.arc(6, -21, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12.5, -23, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(19, -21, 1.2, 0, Math.PI * 2); ctx.fill();
    // jewel
    ctx.fillStyle = '#e0455c';
    ctx.beginPath();
    ctx.arc(12.5, -17, 1.6, 0, Math.PI * 2);
    ctx.fill();

    // eyes: cool black sunglasses (knocked off when dead)
    const dead = state === ST.DEAD;
    if (dead) {
      ctx.strokeStyle = '#3a2a16';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(9, -6); ctx.lineTo(14, -1); ctx.moveTo(14, -6); ctx.lineTo(9, -1); ctx.stroke();
    } else {
      // arm hooking back over the head
      ctx.strokeStyle = '#141414';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(8.5, -5);
      ctx.quadraticCurveTo(3, -7, -1, -5);
      ctx.stroke();
      // lens
      ctx.fillStyle = '#141414';
      ctx.beginPath();
      ctx.ellipse(12.5, -4, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#d4a532';
      ctx.lineWidth = 1;
      ctx.stroke();
      // glint on the lens
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(10, -6.5);
      ctx.lineTo(13.5, -2);
      ctx.stroke();
    }

    // mouth
    ctx.strokeStyle = '#3a2a16';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(17, 3, 2.5, 0.2, Math.PI - 0.4);
    ctx.stroke();

    ctx.restore();
  }

  function drawSparkles() {
    for (const sp of sparkles) {
      ctx.globalAlpha = Math.min(1, sp.life * 2);
      drawBubble(sp.x, sp.y, 0.55 * S());
    }
    ctx.globalAlpha = 1;
  }

  function text(str, x, y, size, fill = '#fff', stroke = '#123a5c', align = 'center') {
    ctx.font = `bold ${size}px -apple-system, "Segoe UI", Arial, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(3, size / 8);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke;
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawUI() {
    const s = S();
    const safeTop = 40 * s;

    if (state === ST.PLAYING) {
      text(score, W / 2, safeTop + 30 * s, 52 * s);
    } else if (state === ST.READY) {
      text('Royal Nemo', W / 2, H * 0.19, 40 * s, '#ffd94a');
      text('Reef Adventure', W / 2, H * 0.26, 40 * s, '#ffd94a');
      text('🐠', W / 2, H * 0.32, 26 * s);
      text('Tap to swim!', W / 2, H * 0.62, 26 * s);
      if (best > 0) text(`Best: ${best}`, W / 2, H * 0.68, 20 * s, '#cdeef5');
    } else if (state === ST.DEAD) {
      // flash on hit
      if (flashT > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashT * 0.6})`;
        ctx.fillRect(0, 0, W, H);
      }
      if (deathT > 0.4) {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 0, W, H);
        text('Blub... Game Over', W / 2, H * 0.3, 40 * s, '#ff8b6b');
        text(`Score: ${score}`, W / 2, H * 0.42, 32 * s);
        text(`Best: ${best}`, W / 2, H * 0.49, 24 * s, '#ffd94a');
        if (score >= best && score > 0) text('New record! 👑', W / 2, H * 0.56, 22 * s, '#aef1b8');
        if (deathT > 0.6 && Math.floor(deathT * 2) % 2 === 0) {
          text('Tap to swim again', W / 2, H * 0.68, 22 * s);
        }
      }
    }
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;

    update(dt);

    drawBackground();
    for (const p of corals) drawCoral(p);
    drawSeabed();
    drawSparkles();
    drawNemo();
    drawUI();

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
