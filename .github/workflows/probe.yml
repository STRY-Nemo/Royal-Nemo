name: Probe live game endpoints
# Read-only health check of everywhere the game lives: the hosts, the
# Firebase leaderboard rules, and a real headless browser run of the
# public link. Deploys nothing.

on:
  push:
    branches: [claude/game-copy-vibe-65sbfz]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hosts
        run: |
          check() {
            echo "===== $1"
            curl -sSL -o body.html -D headers.txt --max-time 30 \
              -w 'FINAL %{http_code} %{url_effective} | %{content_type} | %{size_download}B\n' "$1" || echo "CURL FAILED"
            grep -iE '^(HTTP/|location:|server:|x-nf-request-id:|age:|last-modified:)' headers.txt || true
            echo "TITLE: $(grep -o '<title>[^<]*' body.html | head -1)"
            echo "VERSION: $(grep -oE "const VERSION = '[^']*'" body.html | head -1)"
            echo "HEAD: $(head -c 240 body.html | tr '\n' ' ')"
          }
          for u in https://royal-nemo.netlify.app/ https://royal-nemo.netlify.app/admin.html \
                   https://ryanrhernandez-design.github.io/Royal-Nemo/ https://stry-nemo.github.io/Royal-Nemo/; do
            check "$u"
          done
      - name: Firebase leaderboard
        run: |
          db=https://royal-nemo-default-rtdb.firebaseio.com
          for p in 'scores.json?shallow=true' 'plays.json?shallow=true'; do
            echo "===== /$p"
            curl -sS --max-time 30 -w '\nHTTP %{http_code}\n' "$db/$p" | head -c 300; echo
          done
          curl -sS --max-time 30 -o scores.json "$db/scores.json"
          python3 - <<'PY'
          import json, datetime
          try:
              d = json.load(open('scores.json'))
          except Exception as e:
              print('scores unreadable:', e); raise SystemExit
          if isinstance(d, dict) and 'error' in d:
              print('SCORES BLOCKED:', d['error']); raise SystemExit
          rows = [v for v in (d or {}).values() if isinstance(v, dict)]
          print('score entries:', len(rows))
          ts = [e['ts'] for e in rows if e.get('ts')]
          if ts:
              print('newest score:', datetime.datetime.utcfromtimestamp(max(ts) / 1000).isoformat(), 'UTC')
          rows.sort(key=lambda e: -(e.get('score') or 0))
          for e in rows[:10]:
              print(' ', e.get('score'), e.get('name'), '(device id)' if e.get('pid') else '(legacy)')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real browser run of the public link
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright';
          const url = 'https://royal-nemo.netlify.app/';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
          p.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log('CONSOLE', m.type(), m.text()); });
          p.on('pageerror', e => console.log('PAGEERROR', e.message));
          p.on('requestfailed', r => console.log('REQFAILED', r.url().slice(0, 120), r.failure()?.errorText));
          p.on('response', r => { if (r.status() >= 400) console.log('HTTP', r.status(), r.url().slice(0, 120)); });
          const res = await p.goto(url, { waitUntil: 'load', timeout: 30000 }).catch(e => (console.log('GOTO FAILED', e.message), null));
          console.log('STATUS', res && res.status(), 'TITLE', await p.title().catch(() => '?'));
          await p.waitForTimeout(2500);
          const info = await p.evaluate(() => ({
            canvas: !!document.getElementById('game'),
            overlayOpen: document.getElementById('nameOverlay')?.classList.contains('open'),
            text: document.body.innerText.slice(0, 200)
          })).catch(e => ({ err: e.message }));
          console.log('DOM', JSON.stringify(info));
          await b.close();
          JS
          node check.mjs
